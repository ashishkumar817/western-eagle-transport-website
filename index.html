<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Preconnect to critical origins for faster font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Critical CSS for font-display to prevent FOIT -->
    <style>
      /* System font stack fallback while web fonts load */
      body { font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      h1, h2, h3, h4, h5, h6, .font-heading { font-family: 'Oswald', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
    
    <!-- Load fonts asynchronously to prevent render blocking -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Open+Sans:wght@400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Open+Sans:wght@400;500;600;700&display=swap" /></noscript>
    
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <title>Western Eagle Transport Company | Heavy Equipment Rental UAE</title>
    <meta name="description" content="Premier heavy equipment rental company serving Dubai, Abu Dhabi, and Sharjah. Rent excavators, cranes, forklifts, and more. 10+ years experience, 100+ equipment fleet." />
    <meta name="keywords" content="heavy equipment rental, excavator rental UAE, crane rental Dubai, forklift rental, construction equipment, machinery rental" />
    
    <meta property="og:title" content="Western Eagle Transport Company | Heavy Equipment Rental UAE" />
    <meta property="og:description" content="Premier heavy equipment rental company serving Dubai, Abu Dhabi, and Sharjah." />
    <meta property="og:type" content="website" />
    
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Western Eagle Transport Company" />
    <meta name="twitter:description" content="Premier heavy equipment rental company serving UAE" />
    
    <link rel="canonical" href="https://westerneagle.ae" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
